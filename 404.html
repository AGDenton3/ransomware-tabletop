<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Ransomware Tabletop</title>
  <meta name="robots" content="noindex">
  <!-- Self-contained: GitHub Pages can serve this page at any depth, so it loads no other files. -->
  <style>
    :root { color-scheme: light dark; --bg: #F9F9F9; --ink: #141010; --muted: #5a504d; --accent: #A10006; }
    @media (prefers-color-scheme: dark) { :root { --bg: #110c0c; --ink: #F9F9F9; --muted: #c2b8b6; --accent: #ff6a6f; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; padding: 1.5rem; }
    main { max-width: 34rem; }
    h1 { font: 600 2.4rem/1.15 "Iowan Old Style", Palatino, Georgia, serif; margin: 0 0 .6rem; }
    h1 em { color: var(--accent); }
    p { color: var(--muted); }
    a { color: var(--accent); font-weight: 600; }
    :focus-visible { outline: 3px solid #1a5fb4; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p>404 · Ransomware Tabletop</p>
    <h1>This page is <em>missing</em>, not encrypted.</h1>
    <p>The link may be old or mistyped. Your saved progress is safe in this browser.</p>
    <p><a id="home" href="index.html">Go to the scenario list</a></p>
  </main>
  <script>
    // Point "home" at the site root whether it is served from a domain root or a project path.
    var seg = location.pathname.split('/').filter(Boolean)[0];
    var base = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
    document.getElementById('home').href = base + 'index.html';
  </script>
</body>
</html>
