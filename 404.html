<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not on the menu · Ransomware Tabletop</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5C0A14">
  <!-- GitHub Pages can serve this page at any depth, so the fonts are loaded from the site root by script below. -->
  <style>
    :root { --maroon: #5C0A14; --sauce: #E8A33D; --paper: #F4EBD9; --chalk: #22201C; --grease: #D9C7A3; color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: var(--paper); color: var(--chalk);
      background-image: radial-gradient(var(--grease) 1.1px, transparent 1.5px); background-size: 15px 15px;
      font: 1.05rem/1.6 "Atkinson Hyperlegible", sans-serif; }
    main { max-width: 36rem; }
    .tag { font: .85rem "Bungee", sans-serif; letter-spacing: .14em; }
    h1 { font: 3rem/1.1 "Shrikhand", cursive; color: var(--maroon); text-shadow: 4px 4px 0 var(--sauce); margin: .2rem 0 1rem; }
    a { color: var(--maroon); font: 1rem "Bungee", sans-serif; letter-spacing: .06em; }
    :focus-visible { outline: 4px solid var(--sauce); outline-offset: 2px; box-shadow: 0 0 0 2px var(--chalk); }
  </style>
</head>
<body>
  <main>
    <p class="tag">404 · Ransomware Tabletop</p>
    <h1>That's not on the menu.</h1>
    <p>The link may be old or mistyped. Nothing got encrypted, and your saved progress is fine.</p>
    <p><a id="home" href="index.html">Back to the front counter</a></p>
  </main>
  <script>
    // Work out the site root whether it's served from a domain root or a project path,
    // then point the link and the fonts at it.
    var seg = location.pathname.split('/').filter(Boolean)[0];
    var base = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
    document.getElementById('home').href = base + 'index.html';
    var css = '';
    [['Shrikhand', 'Shrikhand-Regular.ttf'], ['Bungee', 'Bungee-Regular.ttf'], ['Atkinson Hyperlegible', 'AtkinsonHyperlegible-Regular.ttf']].forEach(function (f) {
      css += '@font-face{font-family:"' + f[0] + '";src:url("' + base + 'assets/fonts/' + f[1] + '") format("truetype");font-display:swap}';
    });
    var style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);
  </script>
</body>
</html>
